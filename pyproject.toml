[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workout-parser"
version = "0.2.0"
description = "Parse Intervals.icu JSON and FIT workouts into validated models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fitparse>=1.2.0",
    "pydantic>=2.12.5",
]

[project.scripts]
workout-parser = "workout_parser.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
